name: Terraform CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest

      - name: Show Terraform version
        run: terraform version

      # Validate the examples and e2e configurations against the provider of
      # this commit, not the one released on the registry: a new attribute or
      # resource would otherwise fail validation until it is released, and a
      # broken example for it would only show up after the release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and install the provider of this commit
        run: |
          make build
          make install-plugin
          find examples e2e-tests -name "main.tf" -exec sed -i 's|source *= *"portainer/portainer"|source = "localdomain/local/portainer"|' {} +

      - name: Initialize Terraform
        run: make init

      - name: Validate Terraform configuration
        run: make validate

      - name: Check Terraform formatting
        run: make fmt-check
