name: PR E2E Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker-k8s:
    name: Docker + Kubernetes + Swarm
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧰 E2E setup (with Kubernetes)
        uses: ./.github/actions/e2e-setup
        with:
          kubernetes: "true"

      - name: 🔍 Validate formatting (terraform fmt)
        # Only the Terraform directories: portainer_data/ is Portainer's data
        # directory, which the running container fills with root-only folders
        # that Terraform 1.11+ refuses to walk.
        run: terraform fmt -check -recursive e2e-tests examples

      - name: 🧪 Create Kubernetes Environment
        run: |
          cd e2e-tests/environment
          terraform init -input=false
          terraform fmt -check
          terraform apply -auto-approve
          bash ../lib/expect-converged.sh

      - name: 🧽 Apply Portainer settings
        run: |
          cd e2e-tests/settings
          terraform init -input=false
          terraform fmt -check
          terraform apply -auto-approve
          bash ../lib/expect-converged.sh

      - name: 🧪 Run Terraform E2E tests
        run: |
          # stack_standalone_string is also in FULL_CYCLE_DIRS on purpose: the apply
          # here leaves the container container_exec runs in.
          APPLY_ONLY_DIRS=("deployment" "stack_standalone_string" "webhook" "container_exec" "backup" "auth" "kubernetes_delete_object" "endpoint_snapshot" "endpoint_settings" "kubernetes_namespace" "user_admin" "kubernetes_manifest_dry_run" "data_kubernetes_workloads" "data_portainer_readonly" "data_kubernetes_cluster_readonly" "data_docker_readonly" "data_connection_checks" "data_templates_catalogue" "data_endpoint_registries" "endpoint_relations" "stack_delete_by_name")
          FULL_CYCLE_DIRS=("edge_string" "edge_file" "edge_repository" "kubernetes_application" "kubernetes_deployment_scale" "user_api_key" "endpoint_group_membership" "data_team_memberships" "custom_template_file" "kubernetes_clusterrole" "kubernetes_clusterrolebinding" "kubernetes_configmaps" "kubernetes_cronjob" "kubernetes_helm" "kubernetes_ingress" "kubernetes_ingresscontrollers" "kubernetes_job" "kubernetes_namespace_ingresscontrollers" "kubernetes_namespace_system" "kubernetes_role" "kubernetes_rolebinding" "kubernetes_secret" "kubernetes_service" "kubernetes_serviceaccounts" "kubernetes_storage" "kubernetes_volume"
          "custom_template_string" "custom_template_repository" "docker_image" "docker_network" "docker_plugin" "docker_volume" "stack_standalone_string" "stack_standalone_file" "stack_standalone_repository" "endpoint_group" "tag" "user-team-teammembership" "registry" "environment_tags")
          # portainer_deploy in "deployment" moves the stack to another image
          # revision on purpose, so its plan is never empty.
          NOT_CONVERGING_DIRS=("deployment")

          for dir in "${FULL_CYCLE_DIRS[@]}"; do
            if [ -d "e2e-tests/$dir" ]; then
              echo "▶️ Running full Terraform cycle in e2e-tests/$dir"
              cd "e2e-tests/$dir"
              terraform init -input=false
              terraform fmt -check
              terraform validate
              terraform apply -auto-approve
              bash ../lib/expect-converged.sh
              terraform destroy -auto-approve
              cd -
            fi
          done

          for dir in "${APPLY_ONLY_DIRS[@]}"; do
            if [ -d "e2e-tests/$dir" ]; then
              echo "▶️ Running apply-only Terraform in e2e-tests/$dir"
              cd "e2e-tests/$dir"
              terraform init -input=false
              terraform fmt -check
              terraform validate
              terraform apply -auto-approve
              case " ${NOT_CONVERGING_DIRS[*]} " in
                *" $dir "*) ;;
                *) bash ../lib/expect-converged.sh ;;
              esac
              cd -
            fi
          done

      - name: 🧪 Recover a stack left in Error
        run: |
          cd e2e-tests/stack_error_recovery
          bash run.sh

      - name: 🧪 Kubernetes environment configuration (drift and import)
        run: bash e2e-tests/kubernetes_environment_config/run.sh

      - name: 🧪 Kubernetes manifest drift
        run: bash e2e-tests/kubernetes_manifest_drift/run.sh

      - name: 🧽 Destroy Kubernetes Environment
        run: |
          cd e2e-tests/environment
          terraform destroy -auto-approve

      - name: 🐳 Init Docker Swarm
        run: make swarm-init

      - name: 🧪 Run Terraform E2E tests specific for swarm
        run: |
          SWARM_RESOURCES_FULL_CYCLE=("docker_config" "docker_secret")
          SWARM_RESOURCES_BASIC_CYCLE=("endpoint_swarm_stack" "stack_swarm_string" "endpoint_service_update")

          for dir in "${SWARM_RESOURCES_FULL_CYCLE[@]}"; do
            if [ -d "e2e-tests/$dir" ]; then
              echo "▶️ Running full Terraform cycle in e2e-tests/$dir (Swarm)"
              cd "e2e-tests/$dir"
              terraform init -input=false
              terraform fmt -check
              terraform validate
              terraform apply -auto-approve
              bash ../lib/expect-converged.sh
              terraform destroy -auto-approve
              cd -
            fi
          done

          for dir in "${SWARM_RESOURCES_BASIC_CYCLE[@]}"; do
            if [ -d "e2e-tests/$dir" ]; then
              echo "▶️ Running full Terraform cycle in e2e-tests/$dir (Swarm)"
              cd "e2e-tests/$dir"
              terraform init -input=false
              terraform fmt -check
              terraform validate
              terraform apply -auto-approve
              bash ../lib/expect-converged.sh
              cd -
              sleep 20
            fi
          done

  edge:
    name: Edge Agent
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧰 E2E setup (Docker only)
        uses: ./.github/actions/e2e-setup

      - name: 🧪 Create Edge Agent Environment
        run: |
          cd e2e-tests/edge_agent_environment
          terraform init -input=false
          terraform fmt -check
          terraform validate
          terraform apply -auto-approve

      - name: 🔎 Verify edge_id survives a refresh
        run: |
          cd e2e-tests/edge_agent_environment
          BEFORE=$(terraform output -raw edge_id)
          terraform apply -refresh-only -auto-approve
          AFTER=$(terraform output -raw edge_id)
          if [ -z "$AFTER" ] || [ "$AFTER" != "$BEFORE" ]; then
            echo "::error::edge_id changed on refresh: '$BEFORE' -> '$AFTER' (issue #142)"
            exit 1
          fi
          # The refresh-only apply above re-evaluates the outputs, so the
          # environment_address precondition in output.tf has just re-checked
          # that the address survived the round trip through the API (issue
          # #136). Read it back so a regression is visible in the log too.
          echo "environment_address after refresh: $(terraform output -raw environment_address)"

      - name: 🐳 Start Edge Agent
        run: |
          docker swarm leave --force 2>/dev/null || true
          cd e2e-tests/edge_agent_environment
          EDGE_ID=$(terraform output -raw edge_id)
          EDGE_KEY=$(terraform output -raw edge_key)
          export EDGE_ID EDGE_KEY
          cd "$GITHUB_WORKSPACE"
          make up-edge-agent

      - name: ✅ Verify Edge Agent connection
        run: |
          sleep 15
          docker logs portainer_edge_agent 2>&1 | tail -20
          docker logs portainer_edge_agent 2>&1 | grep -i "poll" && echo "Edge Agent is polling" || echo "Warning: Edge Agent may not be connected yet"

      - name: 🧹 Cleanup Edge Agent
        run: |
          make down-edge-agent
          cd e2e-tests/edge_agent_environment
          terraform destroy -auto-approve

  ssl:
    name: SSL
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧰 E2E setup (Docker only)
        uses: ./.github/actions/e2e-setup

      - name: 🧪 Added SSL for Portainer
        run: |
          cd e2e-tests/ssl
          terraform init -input=false
          terraform fmt -check
          terraform apply -auto-approve

  regressions:
    # Scripted tests for what one apply cannot show: drift made outside
    # Terraform, imports, secrets kept out of state, failed deployments and the
    # admin bootstrap on a fresh instance. Each run.sh asserts plan exit codes
    # and Portainer's own state; see e2e-tests/lib/e2e.sh.
    name: Scripted regressions
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧰 E2E setup (Docker only)
        uses: ./.github/actions/e2e-setup

      - name: 🧪 Webhook drift, import and destroy
        run: bash e2e-tests/webhook_drift_import/run.sh

      - name: 🧪 Endpoint settings drift and import
        run: bash e2e-tests/endpoint_settings_drift_import/run.sh

      - name: 🧪 Registry password_wo stays out of state
        run: bash e2e-tests/registry_password_wo/run.sh

      - name: 🧪 Custom template from a Portainer Source
        run: bash e2e-tests/custom_template_source/run.sh

      - name: 🧪 Admin bootstrap with the setup token (own Portainer instance)
        run: bash e2e-tests/user_admin_setup_token/run.sh
