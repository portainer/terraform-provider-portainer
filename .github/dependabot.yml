version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/e2e-setup
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
