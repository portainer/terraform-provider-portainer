name: "E2E setup"
description: >-
  Shared setup for the end-to-end test jobs: build and install the local
  provider, patch example/e2e main.tf files to use it, start Portainer, and
  install Terraform. Kubernetes (k3d + agent + kompose) is set up only when the
  `kubernetes` input is 'true', so Docker-only / Swarm / Edge / SSL jobs skip
  that expensive step.
inputs:
  kubernetes:
    description: "Set up a k3d cluster, deploy the Portainer agent and install kompose."
    required: false
    default: "false"
  terraform-version:
    description: >-
      Terraform version or constraint to install. 1.11 is the oldest release
      that supports write-only attributes (env_wo, repository_*_wo, ...).
    required: false
    default: "~1.11.0"
  portainer-version:
    description: "Portainer CE image tag to test against."
    required: false
    default: "2.45.3"
runs:
  using: "composite"
  steps:
    - name: ⚙️ Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: ⚙️ Build local provider
      shell: bash
      run: make build

    - name: 🧩 Install local provider plugin
      shell: bash
      run: make install-plugin

    - name: 🩹 Patch main.tf files to use local provider
      shell: bash
      run: |
        find e2e-tests -name "main.tf" -exec sed -i 's|source *= *"portainer/portainer"|source = "localdomain/local/portainer"|' {} +

    - name: 🐳 Start Portainer via Docker Compose
      shell: bash
      env:
        PORTAINER_VERSION: ${{ inputs.portainer-version }}
      # Exported for the rest of the job too, so tests that start a Portainer
      # of their own (user_admin_setup_token) use the version under test.
      run: |
        echo "PORTAINER_VERSION=${PORTAINER_VERSION}" >>"$GITHUB_ENV"
        make up

    - name: 🛠️ Install kubectl
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make install-kubectl

    - name: 🔧 Install k3d
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make install-k3d

    - name: ☸️ Create K3d cluster
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make k3d-up

    - name: ☸️ Verify K3d cluster
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make k3d-status

    - name: 🧠 Deploy Portainer Agent into Kubernetes
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make k8s-deploy-agent

    - name: 🧬 Connect Portainer to k3d network
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make k3d-connect-portainer

    - name: 🌐 Get Kubernetes server IP and export for Terraform
      if: inputs.kubernetes == 'true'
      shell: bash
      run: make k3d-export-ip

    - name: Install Kompose
      if: inputs.kubernetes == 'true'
      shell: bash
      run: |
        curl -L https://github.com/kubernetes/kompose/releases/download/v1.35.0/kompose-linux-amd64 -o kompose
        chmod +x kompose
        sudo mv ./kompose /usr/local/bin/kompose

    - name: ⬇️ Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        # The wrapper turns exit code 2 of `plan -detailed-exitcode` into 0,
        # so every "plan must show changes" or "must converge" check would
        # pass whatever the plan says.
        terraform_wrapper: false
